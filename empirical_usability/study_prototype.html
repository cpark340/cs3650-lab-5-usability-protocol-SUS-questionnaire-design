<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatTracks Elective Lookup: Study Prototype</title>
  <style>
  *{
    box-sizing:border-box
  }
  body{
    margin:0;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#1B2420;
    background:#EEF2EF;
  }
  .vh{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }
  .foot{
    margin:24px 16px;
    font-size:13px;
    color:#3C2A63;
  }

  /* launcher */
  .launch{
    max-width:560px;
    margin:48px auto;
    padding:24px;background:#fff;
    border:1px solid #C9D3CE;
    border-radius:8px;
  }
  .launch a{
    display:block;
    margin:12px 0;
    padding:14px;
    border:2px solid #3C2A63;
    border-radius:8px;color:#3C2A63;
    font-weight:700;
    text-decoration:none;
  }

  /* baseline replica: mirrors the Phase 1 audit (no filters, no compare, low-contrast labels, no dialog role, no focus ring on close) */
  body.b{
    background:#fff;
    color:#222;
    font-family:Roboto,Arial,sans-serif;
    font-size:14px;
  }
  .bhead{
    background:#3C2A63;
    color:#fff;
    padding:14px 24px;
  }
  .bwrap{
    padding:24px;
    max-width:960px;
  }
  .bwrap h1{
    font-size:20px;
    margin:0 0 16px;
  }
  .deg{
    border-collapse:collapse;
    width:100%;
  }
  .deg td{
    padding:10px 8px;
    border-bottom:1px solid #ddd;
    font-size:12px;
    vertical-align:top;
  }
  .bl{
    color:#9358CC;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
  }
  #ov{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #ov[hidden]{
    display:none;
  }
  .modal{
    background:#fff;
    width:min(880px,92vw);
    max-height:84vh;
    display:flex;
    flex-direction:column;
    border-radius:4px;
  }
  .mh{
    display:flex;
    justify-content:space-between;
    align-items:center;padding:16px 24px;
  }
  .mh h2{
    margin:0;
    font-size:18px;
  }
  .x{
    background:none;
    border:0;
    font-size:26px;
    cursor:pointer;
    outline:none;
    padding:4px 8px;
  }
  .mb{
    overflow:auto;
    padding:0 24px 24px;
  }
  .mb h3{
    font-size:16px;
    margin:26px 0 8px;
  }
  .mb .d{
    font-size:13px;
    line-height:1.55;
    margin:0 0 10px;
  }
  .mb b{
    font-size:13px;
  }
  .mb table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:6px;
  }
  .mb th{
    text-align:left;
    color:#8a8a8a;
    font-weight:600;
    padding:6px;
    border-bottom:1px solid #ddd;
  }
  .mb td{
    padding:6px;
    border-bottom:1px solid #eee;
  }
  .mb hr{
    border:0;
    border-top:1px solid #bbb;
    margin:20px 0 0;
  }

  /* treatment: Find Electives page from Phase 2 */
  .skip{
    position:absolute;
    left:8px;top:-60px;
    background:#3C2A63;
    color:#fff;
    padding:12px 16px;
    border-radius:6px;
    z-index:5;
  }
  .skip:focus{top:8px}

  body.t header{
    background:#3C2A63;
    padding:12px 24px;
    display:flex;
    gap:24px;
  }
  body.t header a{
    color:#fff;
    font-weight:700;
  }
  nav ul,nav ol{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  nav[aria-label=Primary]{
    background:#fff;
    border-bottom:1px solid #C9D3CE;
    padding:6px 24px;
  }
  nav[aria-label=Primary] a{
    display:block;
    padding:10px 14px;
    color:#3C2A63;
    text-decoration:none;
    border-bottom:4px solid transparent;
  }
  nav a[aria-current=page]{
    font-weight:700;
    border-bottom-color:#3C2A63;
  }
  nav[aria-label=Breadcrumb]{
    padding:10px 24px;
    font-size:14px;
  }
  nav[aria-label=Breadcrumb] li+li::before{
    content:">";
    margin-right:8px;
  }
  nav[aria-label=Breadcrumb] a{
    color:#0B3D91;
  }
  .layout{display:grid;
    grid-template-columns:1fr 240px;
    gap:24px;
    padding:0 24px 24px;
    align-items:start;
  }
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  main h1{
    font-size:24px;
    margin:8px 0 16px;
  }
  :focus-visible{
    outline:3px solid #0B57D0;
    outline-offset:2px;
  }
  h1:focus,h2:focus{
    outline:none;
  }
  form[role=search]{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
    background:#fff;
    border:1px solid #9358CC;
    border-radius:8px;
    padding:12px 16px;
  }
  select{
    min-height:44px;padding:6px 10px;
    font:inherit;
    border:2px solid #9358CC;
    border-radius:6px;
    background:#fff;
  }
  .chk{
    display:inline-flex;
    align-items:center;
    gap:8px;min-height:44px;
    font-weight:600;
  }
  .chk input{
    width:22px;
    height:22px;
    accent-color:#3C2A63;
  }
  .btn{
    min-height:44px;
    min-width:44px;
    padding:8px 18px;
    font:inherit;
    font-weight:700;
    border-radius:8px;
    border:2px solid #3C2A63;
    background:#3C2A63;
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:#9358CC}
  .btn:active{background:#9358CC}
  .btn.sec{
    background:#fff;
    color:#3C2A63;
  }
  .btn.sec:hover{background:#E6F0EB}
  .btn[aria-disabled=true]{
    background:#DCE2DE;
    border-color:#DCE2DE;
    color:#4F5D56;
    cursor:not-allowed;
  }
  #st{
    margin:14px 0 8px;
    color:#9358CC;
    font-size:15px;
  }
  .res{
    list-style:none;
    margin:0;
    padding:0;
  }
  .res li{margin-bottom:12px}
  .res article,.empty{
    background:#fff;
    border:1px solid #C9D3CE;
    border-radius:8px;
    padding:14px 16px;
  }
  .res h3{
    margin:0 0 4px;
    font-size:17px;
  }
  .m{
    margin:2px 0;
    font-size:14px;
  }
  .act{
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:10px;
  }
  aside{
    background:#fff;
    border:1px solid #9358CC;
    border-radius:8px;
    padding:14px 16px;
    position:sticky;
    top:8px;
  }
  aside h2{
    font-size:16px
    ;margin:0 0 6px;
  }
  aside ul{
    margin:6px 0 12px;
    padding-left:18px;
  }
  aside .btn{
    display:block;
    width:100%;
    margin-top:8px;
  }
  table.cmp,#cmptable table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    margin-top:14px;
    font-size:14px;
  }
  #cmptable caption{
    text-align:left;
    font-weight:700;
    padding:6px 0;
  }
  #cmptable th,#cmptable td{
    border:1px solid #9358CC;
    padding:8px 10px;
    text-align:left;
    vertical-align:top;
  }
  #cmptable thead th{background:#DCE9E3}
  #cmptable tbody th{background:#E6ECE9}
  </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
    // Fictional study dataset. Section = [term, CRN, section, days, time, seats open, seats total, campus]
    const C=[
    {c:"CS 3705",t:"Protocol Analysis",cr:4,p:"CS 2705 with a minimum grade of C",d:"Examines how network protocols work and how traffic is analyzed, including DNS, DHCP, TCP and IP troubleshooting.",s:[["Fall 2026","23188","001","TuTh","10:30am - 11:45am",13,24,"WSU"],["Spring 2026","21877","001","TuTh","10:30am - 11:45am",0,24,"WSU"]]},
    {c:"CS 3720",t:"Network Architectures",cr:4,p:"CS 2705 with a minimum grade of C",d:"Covers TCP/IP, sockets and name services in networked environments.",s:[["Fall 2026","23190","001","MW","1:30pm - 2:45pm",2,30,"WSU"]]},
    {c:"CS 3750",t:"Software Testing",cr:3,p:"CS 2420 with a minimum grade of C",d:"Test planning, unit and integration testing, and automated test tools.",s:[["Fall 2026","23201","001","TuTh","1:30pm - 2:45pm",9,28,"WSU"]]},
    {c:"CS 3810",t:"Computer Graphics",cr:3,p:"CS 2420 with a minimum grade of C",d:"Rendering, transformations and the graphics pipeline.",s:[["Fall 2026","23215","001","MW","9:00am - 10:15am",6,25,"WSU"],["Spring 2026","21902","001","MW","9:00am - 10:15am",0,25,"WSU"]]},
    {c:"CS 3900",t:"Mobile App Development",cr:3,p:"CS 2420 with a minimum grade of C",d:"Designing and building apps for phones and tablets.",s:[["Fall 2026","23230","001","TuTh","3:00pm - 4:15pm",0,30,"WSU"]]},
    {c:"CS 4100",t:"Machine Learning",cr:4,p:"MATH 1210 and CS 2420",d:"Supervised and unsupervised learning, model evaluation and practical projects.",s:[["Fall 2026","23244","001","MW","10:30am - 11:45am",11,30,"WSU"]]},
    {c:"CS 4200",t:"Database Administration",cr:3,p:"CS 3550 with a minimum grade of C",d:"Installing, tuning and securing relational database systems.",s:[["Spring 2027","24310","001","TuTh","9:00am - 10:15am",30,30,"WSU"]]},
    {c:"CS 4310",t:"Cloud Computing",cr:3,p:"CS 2705 with a minimum grade of C",d:"Virtual infrastructure, containers and deploying scalable services.",s:[["Fall 2026","23258","001","TuTh","9:00am - 10:15am",4,24,"WSU"]]},
    {c:"CS 4450",t:"Human-Computer Interaction",cr:3,p:"CS 2420 with a minimum grade of C",d:"Usability principles, prototyping and evaluating interfaces with users.",s:[["Fall 2026","23266","001","MW","3:00pm - 4:15pm",7,24,"WSU"]]},
    {c:"CS 4500",t:"Cybersecurity Defense",cr:3,p:"CS 2705 with a minimum grade of C",d:"Defending networks and systems against common attacks.",s:[["Fall 2026","23271","001","Online","Online section or not yet scheduled",12,40,"ONL"]]},
    {c:"CS 4550",t:"Game Development",cr:3,p:"CS 3810 with a minimum grade of C",d:"Game loops, physics and building a small playable game.",s:[["Fall 2026","23280","001","MW","1:30pm - 2:45pm",0,24,"WSU"]]},
    {c:"CS 4600",t:"Parallel Computing",cr:3,p:"CS 3100 with a minimum grade of C",d:"Threads, synchronization and parallel algorithms.",s:[["Spring 2027","24322","001","MW","1:30pm - 2:45pm",24,24,"WSU"],["Spring 2026","21950","001","MW","1:30pm - 2:45pm",0,24,"WSU"]]},
    {c:"CS 4700",t:"Embedded Systems",cr:4,p:"CS 2420 with a minimum grade of C",d:"Programming microcontrollers and working with sensors.",s:[["Fall 2026","23290","001","F","9:00am - 11:30am",10,20,"WSU"]]},
    {c:"CS 4800",t:"Senior Project Prep",cr:3,p:"Senior standing",d:"Planning and scoping a senior project with a faculty mentor.",s:[["Fall 2026","23301","001","TuTh","4:30pm - 5:45pm",15,25,"WSU"]]}
    ];
    const app=document.getElementById("app"),$=s=>document.querySelector(s);
    const foot='<p class="foot">Prototype for a CS 3650 usability study. Course data is fictional.</p>';
    const when=s=>s[3]==="Online"?"Online":s[3]+" "+s[4];

    function launcher(){
      document.body.className="";
      app.innerHTML=`<div class="launch"><h1>CatTracks elective lookup: study prototype</h1>
      <p>Researcher launcher. Open the condition for the current session, then hand the device to the participant.</p>
      <a href="#baseline">Baseline: current modal replica</a><a href="#treatment">Treatment: Find Electives page</a>${foot}</div>`;
    }

    function baseline(){
      document.body.className="b";
      const rows=[1,2].map(n=>`<tr><td>&#9675; CS Elective Course #${n}</td><td><b>Still needed:</b></td><td><b>1</b> Class in <a class="bl" role="presentation">CS 3000:5999</a> with credits &gt;= 3.0</td></tr>`).join("");
      const body=C.map(c=>{
        const sr=c.s.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[5]} (out of ${s[6]})</td><td>${s[3]==="Online"?s[4]:s[3]+" "+s[4]}</td><td>${s[7]}</td></tr>`).join("");
        return `<h3>${c.c} - ${c.cr} Credits - ${c.t}</h3><p class="d">${c.d}</p><b>Attributes:</b><br>UD<br><br><b>Prerequisites:</b><br>${c.p}<br><br><b>Sections:</b><table><tr><th>Term</th><th>CRN</th><th>Section</th><th>Seats open</th><th>Meeting times</th><th>Campus</th></tr>${sr}</table><hr>`;
      }).join("");
      app.innerHTML=`<div class="bhead">CatTracks &nbsp;|&nbsp; Degree Evaluation</div><div class="bwrap"><h1>Degree Evaluation: Computer Science, BS</h1><table class="deg">${rows}</table></div>
      <div id="ov" hidden><div class="modal"><div class="mh"><h2>Course Information</h2><button class="x" aria-label="Close">&times;</button></div><div class="mb">${body}</div></div></div>${foot}`;
      app.onclick=e=>{ if(e.target.closest(".bl")) $("#ov").hidden=false; if(e.target.closest(".x")) $("#ov").hidden=true; };
      app.onchange=null;
    }

    function treatment(){
      document.body.className="t";
      const st={term:"Fall 2026",open:false,picked:[]};
      app.innerHTML=`<a class="skip" href="#main" onclick="event.preventDefault();document.querySelector('main h1').focus()">Skip to main content</a>
      <header><a href="#treatment">CatTracks</a><a href="#treatment">Back to Degree Audit</a></header>
      <nav aria-label="Primary"><ul><li><a href="#treatment">My Degree</a></li><li><a href="#treatment" aria-current="page">Find Electives</a></li><li><a href="#treatment">My Schedule</a></li></ul></nav>
      <nav aria-label="Breadcrumb"><ol><li><a href="#treatment">My Degree</a></li><li aria-current="page">Find Electives</li></ol></nav>
      <div class="layout"><main id="main"><h1 tabindex="-1">Find electives: CS Elective Course</h1>
      <section id="listview"><form role="search" aria-label="Filter courses" onsubmit="return false">
      <label>Term <select id="term"><option>Fall 2026</option><option>Spring 2027</option><option>All terms</option></select></label>
      <label class="chk"><input type="checkbox" id="open"> Open seats only</label>
      <button type="button" class="btn sec" id="clear">Clear filters</button></form>
      <p id="st" role="status" aria-live="polite"></p><ul class="res" id="res"></ul></section>
      <section id="cmpview" hidden><h2 id="cmph" tabindex="-1">Compare courses</h2><button type="button" class="btn sec" id="back">Back to results</button><div id="cmptable"></div></section></main>
      <aside aria-label="Compare tray"><h2>Compare tray</h2><p id="trayn"></p><ul id="trayl"></ul>
      <button type="button" class="btn" id="cmpbtn" aria-disabled="true" aria-describedby="trayn">Compare</button>
      <button type="button" class="btn sec" id="clr">Clear selection</button></aside></div>${foot}`;
      const vis=c=>c.s.filter(s=>(st.term==="All terms"||s[0]===st.term)&&(!st.open||s[5]>0));
      const say=m=>{const el=$("#st"); el.textContent=""; setTimeout(()=>el.textContent=m,40);};
      function res(){
        const list=C.map(c=>[c,vis(c)]).filter(x=>x[1].length);
        $("#res").innerHTML=list.map(([c,v],i)=>`<li><article aria-labelledby="h${i}"><h3 id="h${i}">${c.c} ${c.t}</h3><p class="m">${c.cr} credits · Upper division</p>${v.map(s=>`<p class="m">${s[0]} · ${when(s)} · ${s[7]} · <b>${s[5]} of ${s[6]} seats open</b></p>`).join("")}<div class="act"><button type="button" class="btn sec" data-d="${i}" aria-expanded="false" aria-controls="d${i}">Show details</button><label class="chk"><input type="checkbox" data-c="${c.c}" ${st.picked.includes(c.c)?"checked":""}> Compare <span class="vh">${c.c}</span></label></div><div id="d${i}" hidden><p>${c.d}</p><p><b>Prerequisites:</b> ${c.p}</p></div></article></li>`).join("")||'<li class="empty">No courses match your filters.</li>';
        say(list.length?`${list.length} courses match`:"No courses match your filters. Use Clear filters to start over.");
      }
      function tray(){
        const n=st.picked.length; $("#trayn").textContent=`${n} of 3 selected`;
        $("#trayl").innerHTML=st.picked.map(c=>`<li>${c}</li>`).join("");
        $("#cmpbtn").setAttribute("aria-disabled",String(n<2));
      }
      function cmp(){
        const cs=st.picked.map(k=>C.find(c=>c.c===k)),s0=c=>vis(c)[0]||c.s[0];
        const row=(l,f)=>`<tr><th scope="row">${l}</th>${cs.map(c=>`<td>${f(c)}</td>`).join("")}</tr>`;
        $("#cmptable").innerHTML=`<table><caption>${cs.map(c=>c.c).join(" and ")} compared</caption><thead><tr><td></td>${cs.map(c=>`<th scope="col">${c.c} ${c.t}</th>`).join("")}</tr></thead><tbody>${row("Credits",c=>c.cr)}${row("Prerequisites",c=>c.p)}${row("Term",c=>s0(c)[0])}${row("Meeting times",c=>when(s0(c)))}${row("Seats open",c=>s0(c)[5]+" of "+s0(c)[6])}${row("Campus",c=>s0(c)[7])}</tbody></table>`;
        $("#listview").hidden=true; $("#cmpview").hidden=false; $("#cmph").focus();
      }
      app.onclick=e=>{
        const d=e.target.closest("[data-d]");
        if(d){const p=$("#d"+d.dataset.d),o=d.getAttribute("aria-expanded")==="true"; d.setAttribute("aria-expanded",String(!o)); p.hidden=o; d.textContent=o?"Show details":"Hide details";}
        if(e.target.closest("#clear")){st.term="Fall 2026";st.open=false;$("#term").value="Fall 2026";$("#open").checked=false;res();}
        if(e.target.closest("#clr")){st.picked=[];tray();res();}
        if(e.target.closest("#cmpbtn")){ if(st.picked.length<2) say("Select at least 2 courses to compare."); else cmp(); }
        if(e.target.closest("#back")){$("#cmpview").hidden=true;$("#listview").hidden=false;$("main h1").focus();}
      };
      app.onchange=e=>{
        const t=e.target;
        if(t.id==="term"){st.term=t.value;res();}
        else if(t.id==="open"){st.open=t.checked;res();}
        else if(t.dataset.c){
          if(t.checked){ if(st.picked.length>=3){t.checked=false;say("You can compare up to 3 courses. Clear one to add another.");return;} st.picked.push(t.dataset.c); }
          else st.picked=st.picked.filter(x=>x!==t.dataset.c);
          tray();
        }
      };
      res(); tray();
    }

    function route(){
      const h=location.hash.slice(1);
      if(h==="baseline") baseline(); else if(h==="treatment") treatment(); else if(h===""||!app.innerHTML) launcher();
    }
    window.addEventListener("hashchange",route); route();
    </script>
  </body>
</html>
